# APNs for pirc-gateway.service: install as
# /etc/systemd/system/pirc-gateway.service.d/apns.conf, with the production
# .p8 key from the Apple developer account at the path below and its key ID
# and team ID filled in. Development builds' tokens need apns-sandbox.conf
# too; the team ID here serves both.
[Service]
LoadCredential=apns:/etc/pirc-gateway/AuthKey.p8
Environment=PIRC_GATEWAY_APNS_KEY_FILE=%d/apns
Environment=PIRC_GATEWAY_APNS_KEY_ID=CHANGE-ME
Environment=PIRC_GATEWAY_APNS_TEAM_ID=CHANGE-ME
