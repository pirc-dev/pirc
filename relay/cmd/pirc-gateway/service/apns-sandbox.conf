# APNs for development builds' tokens, for pirc-gateway.service: install as
# /etc/systemd/system/pirc-gateway.service.d/apns-sandbox.conf, with the
# sandbox .p8 key at the path below and its key ID filled in. The team ID
# is apns.conf's.
[Service]
LoadCredential=apns-sandbox:/etc/pirc-gateway/AuthKey-sandbox.p8
Environment=PIRC_GATEWAY_APNS_SANDBOX_KEY_FILE=%d/apns-sandbox
Environment=PIRC_GATEWAY_APNS_SANDBOX_KEY_ID=CHANGE-ME
