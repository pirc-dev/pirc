# TLS for pirc-relay.service: install as
# /etc/systemd/system/pirc-relay.service.d/tls.conf and point the two paths
# at your certificate and key. systemd reads them as root and hands the
# service private copies, so the key can stay readable by root only. The
# relay reads them once: restart it after a renewal (docs/self-hosting.md).
[Service]
LoadCredential=cert:/etc/letsencrypt/live/relay.example.com/fullchain.pem
LoadCredential=key:/etc/letsencrypt/live/relay.example.com/privkey.pem
Environment=PIRC_RELAY_TLS_CERT=%d/cert
Environment=PIRC_RELAY_TLS_KEY=%d/key
