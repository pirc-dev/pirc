# TLS for pirc-web.service: install as
# /etc/systemd/system/pirc-web.service.d/tls.conf and point the two paths at
# your certificate and key. systemd reads them as root and hands the service
# private copies, so the key can stay readable by root only. pirc-web reads
# them once: restart it after a renewal.
[Service]
LoadCredential=cert:/etc/letsencrypt/live/pirc.example/fullchain.pem
LoadCredential=key:/etc/letsencrypt/live/pirc.example/privkey.pem
Environment=PIRC_WEB_TLS_CERT=%d/cert
Environment=PIRC_WEB_TLS_KEY=%d/key
