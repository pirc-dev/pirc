// What a channel between a client and a pi process carries, inside Noise
// IK's transport (docs/e2e.md, section 4). The relay sees none of it.
//
// A ChannelFrame is cut into Noise messages: each plaintext is one byte, 1
// for a frame's last piece and 0 for a piece with more to come, then at
// most 65,518 bytes of the frame. A frame is at most 1 MiB and 4 KiB; a
// larger one, or any other first byte, ends the channel.
syntax = "proto3";

package pirc.v1alpha2;

message ChannelFrame {
  oneof body {
    // Client to computer, the channel's first frame and only then: the
    // client's newest list, as signed bytes. The computer stores it if it
    // is newer, and only then checks that the client is on its newest
    // list; it sends nothing before that.
    bytes list = 1;
    // Computer to client, once, the answer to `list`.
    ListState list_state = 2;
    // Either way, after list_state: a session's messages.
    SessionFrame session = 3;
    // Either way: how many Noise messages this side has taken on the
    // channel so far, sent once it has taken 8, or 128 KiB, since its last.
    // Each side keeps at most 16 messages and 256 KiB beyond the other's
    // count in flight, not counting `received` itself, which is sent
    // outside that window and is not counted back. So the relay's queue
    // for one channel stays under its cap (1 MiB, 64 frames); a client
    // keeps the sum over its channels under its connection's cap (4 MiB,
    // 256 frames) by holding its counts back.
    uint64 received = 4;
  }
}

message ListState {
  // The computer's newest list's counter.
  uint64 counter = 1;
  // That list's signed bytes, only when its counter is above the client's.
  bytes list = 2;
}

message SessionFrame {
  // Every request names its session; a process answers one it does not
  // run with SESSION_GONE.
  string session_id = 1;
  oneof body {
    // A pirc.v1alpha1.SessionMessage, as a self-hosted relay routes it.
    bytes message = 2;
    // Computer to client: a pirc.v1alpha1.SessionAnnouncement, the
    // session's whole state, when the channel is ready and on every change.
    bytes announcement = 3;
  }
}
