// The relay protocol of a hosted relay (docs/e2e.md): every frame on a
// WebSocket between the relay and a device. One Frame per binary
// WebSocket message. A self-hosted relay speaks v1alpha1 only, and a
// hosted relay v1alpha2 only (docs/e2e.md, section 9).
//
// The relay reads these frames but not their payloads: announcements,
// routed frames and join steps pass through it unread.
syntax = "proto3";

package pirc.v1alpha2;

import "google/protobuf/timestamp.proto";
import "pirc/v1alpha1/common.proto";

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_V1ALPHA2 = 2;
}

message Frame {
  oneof body {
    // Login, in order: Hello (peer), Challenge (relay), Auth (peer),
    // Welcome (relay). Nothing else may be sent before Welcome.
    Hello hello = 1;
    Challenge challenge = 2;
    Auth auth = 3;
    Welcome welcome = 4;

    // Host to relay: sessions of this connection.
    SessionAnnounce session_announce = 10;
    SessionEnd session_end = 11;

    // Client or read-only key to relay: what to receive.
    SubscribeSessions subscribe_sessions = 20;
    Attach attach = 21;
    Detach detach = 22;
    WatchDevices watch_devices = 23;

    // Relay to client: the session list and its changes.
    SessionList session_list = 30;
    SessionUpdated session_updated = 31;
    SessionEnded session_ended = 32;
    Devices devices = 33;

    // Between a session and clients, through the relay.
    Routed routed = 40;

    // Answers to the account frames below.
    Done done = 79;

    // Joining: the relay pairs two devices and passes their steps on.
    JoinWait join_wait = 80;
    JoinLookup join_lookup = 81;
    JoinPaired join_paired = 82;
    JoinMessage join_message = 83;
    JoinEnded join_ended = 84;

    // Accounts (docs/e2e.md, section 7). Client to relay, logged in
    // without an account: making one. Client to relay: deleting its own.
    SignUp sign_up = 90;
    SignedUp signed_up = 91;
    DeleteAccount delete_account = 92;
    RegisterPush register_push = 93;
    UnregisterPush unregister_push = 94;
    RenewSubscription renew_subscription = 95;

    // Either direction, as in v1alpha1. A device is never removed by a
    // close: 1008 means only that the relay refuses its key now.
    pirc.v1alpha1.Error error = 50;
  }
  reserved 12, 70 to 78;
  reserved "publish_bundle", "publish_version", "publish_withdrawal", "get_versions", "versions", "publish_pre_key", "pre_keys", "publish_labels", "publish_label_key_wraps", "label_state";
}

message Hello {
  ProtocolVersion protocol_version = 1;
  // The peer's Ed25519 public key, 32 bytes.
  bytes public_key = 2;
  // The account it logs in to, 32 bytes. Empty to log in without one:
  // to sign up, or to wait for a join as a new device.
  bytes account_id = 3;
}

message Challenge {
  // 32 random bytes.
  bytes nonce = 1;
}

message Auth {
  // Ed25519 signature over framed("pirc-auth-v1alpha2", account ID, the
  // relay's origin, nonce): the context's ASCII, a NUL byte, then each
  // part prefixed by its length as an unsigned LEB128.
  bytes signature = 1;
}

message Welcome {
  ProtocolVersion protocol_version = 1;
  // Largest Frame the relay accepts or sends, encoded.
  uint32 max_frame_bytes = 2;
  // The key's role in the account; unspecified when logged in without
  // an account.
  DeviceRole role = 3;
  reserved 4;
  reserved "list_version";
  // The account is locked: every subscription its phones had has lapsed,
  // and the stores' own grace with it (docs/design.md, step 14, stage 4).
  // Only a client logs in to a locked account, and it may only renew
  // (RenewSubscription) or delete the account; hosts and read-only keys
  // are refused, with PERMISSION_DENIED. A locked account is deleted 60
  // days after it locked. A lock coming while devices are connected
  // closes them with 1008, which says only that, as ever.
  bool locked = 5;
  // To a client: the account's subscriptions, as the stores last said, so
  // that every client shows who pays and until when, and offers a
  // purchase only when none will carry the account on (docs/design.md,
  // step 14, stage 5, decision D1). Empty to hosts and read-only keys.
  repeated AccountSubscription subscriptions = 6;
}

// A device's role in its account.
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  // A machine running pi.
  DEVICE_ROLE_HOST = 1;
  // A phone, a browser or another app: a shell on every host.
  DEVICE_ROLE_CLIENT = 2;
  // A phone's second key, readable while it is locked: announcements
  // only.
  DEVICE_ROLE_READ_ONLY = 3;
}

// Which store a subscription is through.
enum SubscriptionStore {
  SUBSCRIPTION_STORE_UNSPECIFIED = 0;
  SUBSCRIPTION_STORE_APP_STORE = 1;
  SUBSCRIPTION_STORE_GOOGLE_PLAY = 2;
  // A test relay's, which takes any subscription.
  SUBSCRIPTION_STORE_TEST = 3;
}

// One of an account's subscriptions, as its store last said. It names no
// device: which phone bought it is the store's to know, not the relay's.
message AccountSubscription {
  SubscriptionStore store = 1;
  // Paid for until then, the store's grace included; unset when the
  // store names no end.
  google.protobuf.Timestamp ends = 2;
  // The store will renew it at its end.
  bool renews = 3;
  // The store's free trial.
  bool trial = 4;
  // The store no longer has it live.
  bool lapsed = 5;
}

// Host to relay, as in v1alpha1; the relay stores the payload unread.
message SessionAnnounce {
  pirc.v1alpha1.SessionRef session = 1;
  reserved 2;
  reserved "keys";
  bytes payload = 3;
  // As in v1alpha1: wake the clients registered for push.
  bool push = 4;
}

message SessionEnd {
  pirc.v1alpha1.SessionRef session = 1;
}

message SubscribeSessions {}

message Attach {
  pirc.v1alpha1.SessionRef session = 1;
}

message Detach {
  pirc.v1alpha1.SessionRef session = 1;
}

message SessionEntry {
  pirc.v1alpha1.SessionRef session = 1;
  reserved 2, 5;
  reserved "keys", "bundles";
  // The latest announcement, as the host sent it.
  bytes payload = 3;
  google.protobuf.Timestamp announced_at = 4;
}

// Relay to client: every live session, in frames of at most
// max_frame_bytes, as in v1alpha1.
message SessionList {
  repeated SessionEntry sessions = 1;
  bool more = 2;
}

// A session's announcement changed.
message SessionUpdated {
  SessionEntry entry = 1;
}

message SessionEnded {
  pirc.v1alpha1.SessionRef session = 1;
}

// Client to relay: send me Devices now and whenever it changes.
message WatchDevices {}

// When the relay last saw each device of the account.
message DeviceStatus {
  bytes public_key = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
  // Whether it is registered for push.
  bool push = 4;
}

message Devices {
  repeated DeviceStatus devices = 1;
}

// As in v1alpha1; the relay passes the payload on unread.
message Routed {
  pirc.v1alpha1.SessionRef session = 1;
  bytes client_key = 2;
  reserved 3;
  reserved "keys";
  bytes payload = 4;
}

message Done {
  string request_id = 1;
}

// New device to relay, logged in without an account: wait for a client to
// type the code whose first four characters are `lookup`. The relay
// answers JoinPaired when one does, or Error with RATE_LIMITED or INVALID
// (a lookup already waiting). The wait ends after ten minutes, with Error
// TIMEOUT, and a join paired from it ten minutes after the wait began.
message JoinWait {
  // Four Crockford base32 characters, upper case.
  string lookup = 1;
  // A phone's (docs/e2e.md, section 7); unset for a host or a browser.
  Attestation attestation = 2;
}

// Client to relay: join the device waiting under `lookup`. Answered by
// JoinPaired, or Error with SESSION_NOT_FOUND. Lookups are capped per
// account and per address.
message JoinLookup {
  string request_id = 1;
  string lookup = 2;
}

// Relay to both sides: the join's ID, for its messages.
message JoinPaired {
  string request_id = 1;
  string join_id = 2;
}

// Either side: one step of the join, passed to the other side unread.
message JoinMessage {
  string join_id = 1;
  bytes step = 2;
}

// Either side to relay, and relay to the other: the join is over, done or
// failed. Each lookup pairs once.
message JoinEnded {
  string join_id = 1;
}

// Phone to relay, logged in without an account: make an account with
// this key as its one client. Answered by SignedUp, or Error with the
// request_id: PERMISSION_DENIED when sign-ups are closed and the invite
// code is not good, or the attestation or subscription is refused. The
// phone then logs in again, with the account's ID. A key that already
// made an account is answered by SignedUp again, with that account's ID.
message SignUp {
  string request_id = 1;
  reserved 2;
  reserved "version";
  Attestation attestation = 3;
  string invite_code = 4;
}

message SignedUp {
  string request_id = 1;
  // SHA-256 of the signing-up key.
  bytes account_id = 2;
}

// That a real app on a real phone asks (docs/e2e.md, section 7). It
// stops abuse only; it never decides who belongs to an account.
message Attestation {
  oneof kind {
    AppAttest app_attest = 1;
    PlayIntegrity play_integrity = 2;
    // Only on a relay started with a test verifier.
    bytes test = 3;
  }
  // Apple's signed transaction, or Google's purchase token, for the
  // subscription check; empty during a trial the relay counts itself.
  string subscription = 4;
}

message AppAttest {
  bytes key_id = 1;
  bytes attestation = 2;
}

message PlayIntegrity {
  string token = 1;
}

// Client to relay: a subscription the store proves, for an account that
// is locked or is to have one more. Answered by Done once the store says
// it is live, and then, on a locked account, the connection closes (1000
// "renewed") so that every device logs in again to an unlocked account;
// or by Error with PERMISSION_DENIED and the store's reason.
message RenewSubscription {
  string request_id = 1;
  oneof proof {
    // StoreKit's signed transaction (jwsRepresentation).
    string app_store_transaction = 2;
    // Google Play's purchase token.
    string google_play_token = 3;
  }
}

// Client to relay: delete this account and everything the relay holds
// of it, and close every connection to it. Answered by Done before
// the close.
message DeleteAccount {
  string request_id = 1;
}

// As in v1alpha1, for the account's clients.
message RegisterPush {
  string request_id = 1;
  string handle = 2;
}

message UnregisterPush {
  string request_id = 1;
}
