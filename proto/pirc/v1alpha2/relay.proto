// The relay protocol of a hosted relay (docs/e2e.md): every frame on a
// WebSocket between the relay and a device. One Frame per binary
// WebSocket message. A self-hosted relay speaks v1alpha1 only, and a
// hosted relay v1alpha2 only (docs/e2e.md, section 9).
//
// The relay reads these frames but not what is sealed or encrypted in
// them: sealed copies, channel messages and join steps pass through it
// unread, and it never names the sender of any of them.
syntax = "proto3";

package pirc.v1alpha2;

import "google/protobuf/timestamp.proto";
import "pirc/v1alpha1/common.proto";

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_V1ALPHA2 = 2;
}

message Frame {
  oneof body {
    // Login, in order: Hello (peer), Challenge (relay), Auth (peer),
    // Welcome (relay). Nothing else may be sent before Welcome, but for
    // the List a removed key is given before its refusal (List).
    Hello hello = 1;
    Challenge challenge = 2;
    Auth auth = 3;
    Welcome welcome = 4;

    // Host to relay: sessions of this connection.
    SessionAnnounce session_announce = 10;
    SessionEnd session_end = 11;

    // Client to relay: what to receive.
    SubscribeSessions subscribe_sessions = 20;
    WatchDevices watch_devices = 23;

    // Relay to client: the session list and its changes.
    SessionList session_list = 30;
    SessionUpdated session_updated = 31;
    SessionEnded session_ended = 32;
    Devices devices = 33;

    // The account's device list (docs/e2e.md, section 3). A client or
    // host to relay: a newer version; relay to device: the newest.
    PublishList publish_list = 60;
    List list = 61;

    // A channel between a client and a pi process (docs/e2e.md, section
    // 4): its Noise messages, passed on unread.
    OpenChannel open_channel = 41;
    ChannelOpened channel_opened = 42;
    ChannelMessage channel_message = 43;
    CloseChannel close_channel = 44;

    // The account's phone to relay: the names sealed to each client.
    PublishNames publish_names = 62;
    // Read-only key to relay, and the answer: the notices sealed to its
    // phone.
    FetchNotices fetch_notices = 63;
    Notices notices = 64;

    // Answers to the account frames below.
    Done done = 79;

    // Joining: the relay pairs two devices and passes their steps on.
    JoinWait join_wait = 80;
    JoinLookup join_lookup = 81;
    JoinPaired join_paired = 82;
    JoinMessage join_message = 83;
    JoinEnded join_ended = 84;

    // Accounts (docs/e2e.md, section 7). Client to relay, logged in
    // without an account: making one. The account's phone to relay:
    // deleting it.
    SignUp sign_up = 90;
    SignedUp signed_up = 91;
    DeleteAccount delete_account = 92;
    RegisterPush register_push = 93;
    UnregisterPush unregister_push = 94;
    RenewSubscription renew_subscription = 95;
    CheckInvite check_invite = 96;
    InviteChecked invite_checked = 97;

    // Either direction, as in v1alpha1. A device is never removed by a
    // close: 1008 means only that the relay refuses its key now.
    pirc.v1alpha1.Error error = 50;
  }
  reserved 12, 21, 22, 40, 70 to 78;
  reserved "attach", "detach", "routed", "publish_bundle", "publish_version", "publish_withdrawal", "get_versions", "versions", "publish_pre_key", "pre_keys", "publish_labels", "publish_label_key_wraps", "label_state";
}

message Hello {
  ProtocolVersion protocol_version = 1;
  // The peer's Ed25519 public key, 32 bytes.
  bytes public_key = 2;
  // The account it logs in to, 32 bytes. Empty to log in without one:
  // to sign up, or to wait for a join as a new device.
  bytes account_id = 3;
  // The highest version of the account's list the device holds, 0 for
  // none: Welcome carries the relay's newest only when it is higher.
  uint64 list_counter = 4;
  // A computer's pi process, 1 to 128 bytes, required from a computer and
  // empty from anything else: channels are opened to it by this ID
  // (OpenChannel), and its announcements carry it. A newer connection of
  // the same key and instance takes new channels and its sessions.
  string instance_id = 5;
}

message Challenge {
  // 32 random bytes.
  bytes nonce = 1;
}

message Auth {
  // Ed25519 signature over framed("pirc-auth-v1alpha2", account ID, the
  // relay's origin, nonce): the context's ASCII, a NUL byte, then each
  // part prefixed by its length as an unsigned LEB128.
  bytes signature = 1;
}

message Welcome {
  ProtocolVersion protocol_version = 1;
  // Largest Frame the relay accepts or sends, encoded.
  uint32 max_frame_bytes = 2;
  // The key's role in the account; unspecified when logged in without
  // an account.
  DeviceRole role = 3;
  reserved 4;
  reserved "list_version";
  // The account is locked: every subscription its phones had has lapsed,
  // and the stores' own grace with it (docs/design.md, step 14, stage 4).
  // Only a client logs in to a locked account, and it may only renew
  // (RenewSubscription) or delete the account; hosts and read-only keys
  // are refused, with PERMISSION_DENIED. A locked account is deleted 60
  // days after it locked. A lock coming while devices are connected
  // closes them with 1008, which says only that, as ever.
  bool locked = 5;
  // To a client: the account's subscriptions, as the stores last said, so
  // that every client shows who pays and until when, and offers a
  // purchase only when none will carry the account on (docs/design.md,
  // step 14, stage 5, decision D1). Empty to hosts and read-only keys.
  repeated AccountSubscription subscriptions = 6;
  // The counter of the newest version of the account's list the relay
  // holds; 0 when logged in without an account.
  uint64 list_counter = 7;
  // That version as signed (the signature, then the body), only when its
  // counter is above Hello.list_counter. A device checks it as any
  // version (docs/e2e.md, section 3); a device whose list is newer than
  // list_counter publishes its own (PublishList).
  bytes list = 8;
}

// A device's role in its account.
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  // A machine running pi.
  DEVICE_ROLE_HOST = 1;
  // A phone, a browser or another app: a shell on every host.
  DEVICE_ROLE_CLIENT = 2;
  // A phone's read-only key, readable while it is locked: the account's
  // newest list and its notices only. It sends only FetchNotices (and
  // Error); anything else is refused with PERMISSION_DENIED.
  DEVICE_ROLE_READ_ONLY = 3;
}

// Which store a subscription is through.
enum SubscriptionStore {
  SUBSCRIPTION_STORE_UNSPECIFIED = 0;
  SUBSCRIPTION_STORE_APP_STORE = 1;
  SUBSCRIPTION_STORE_GOOGLE_PLAY = 2;
  // A test relay's, which takes any subscription.
  SUBSCRIPTION_STORE_TEST = 3;
  // No store: the account was made with a review code, for the stores'
  // reviewers, and is deleted when this ends.
  SUBSCRIPTION_STORE_REVIEW = 4;
}

// One of an account's subscriptions, as its store last said. It names no
// device: which phone bought it is the store's to know, not the relay's.
message AccountSubscription {
  SubscriptionStore store = 1;
  // Paid for until then, the store's grace included; unset when the
  // store names no end.
  google.protobuf.Timestamp ends = 2;
  // The store will renew it at its end.
  bool renews = 3;
  // The store's free trial.
  bool trial = 4;
  // The store no longer has it live.
  bool lapsed = 5;
}

// A copy sealed to one device (docs/e2e.md, section 5): the relay keeps
// it unread and gives it to that device only.
message SealedCopy {
  // A client's box key, or a phone's notification key.
  bytes recipient_key = 1;
  // The nonce, then crypto_box_easy, as e2e/sealed.ts makes it.
  bytes sealed = 2;
}

// Host to relay: a live session of this connection's process, its
// instance ID the connection's (Hello.instance_id), with its copies, kept
// in memory with the session. Each one replaces both kinds of the
// session's copies wholly, so a recipient left out loses its old copy.
// At most 10 copies of each kind, one per recipient, each 40 to 8,192
// bytes: a recipient twice, more than 10, or a copy too short is INVALID,
// too long TOO_LARGE, and the copies stored stay. A copy to a key not on
// the relay's newest list (a client's box key for an announcement, a
// phone's notification key for a notice) is dropped and the rest kept.
// Past the caps: 5 a second per connection (20 at once), 32 sessions per
// connection and 256 per account, 2 MiB of copies per account,
// RATE_LIMITED. A session's copies are deleted when it ends (SessionEnd,
// its connection closing, its computer removed) or their recipient is
// removed; but a notice stays fetchable for ten minutes after its session
// ends, unless its computer or recipient is removed.
message SessionAnnounce {
  pirc.v1alpha1.SessionRef session = 1;
  reserved 2, 3;
  reserved "keys", "payload";
  // Wake the account's phones registered for push and not connected,
  // through the relay's push gateway if it has one.
  bool push = 4;
  // One per client on the list, to its box key.
  repeated SealedCopy announcements = 5;
  // One per phone on the list, to its notification key.
  repeated SealedCopy notices = 6;
}

message SessionEnd {
  pirc.v1alpha1.SessionRef session = 1;
}

// Client to relay: send me SessionList now, and the changes after it.
// Clients only: a read-only key holds no box key.
message SubscribeSessions {}

// A session as one client is told it: each subscriber's entries are its
// own.
message SessionEntry {
  pirc.v1alpha1.SessionRef session = 1;
  reserved 2, 3, 5;
  reserved "keys", "payload", "bundles";
  google.protobuf.Timestamp announced_at = 4;
  // The latest announcement's copy sealed to this client's box key;
  // empty when the computer sealed it none (a client added since).
  bytes sealed = 6;
}

// Relay to client: every live session, in frames of at most
// max_frame_bytes, as in v1alpha1.
message SessionList {
  repeated SessionEntry sessions = 1;
  bool more = 2;
}

// A session's announcement changed.
message SessionUpdated {
  SessionEntry entry = 1;
}

message SessionEnded {
  pirc.v1alpha1.SessionRef session = 1;
}

// Client to relay: send me Devices now and whenever it changes.
message WatchDevices {}

// When the relay last saw each device of the account's newest list.
message DeviceStatus {
  // The device's signing key. A login by a phone's read-only key counts
  // as that phone's for last_seen, not for online.
  bytes public_key = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
  // Whether it is registered for push.
  bool push = 4;
}

// One entry per device on the account's newest list, in its order.
message Devices {
  repeated DeviceStatus devices = 1;
  // The account's phone's names, signed and sealed to this client's box
  // key (PublishNames); empty if it has none.
  bytes names = 2;
}

// The account's phone (its signing key, version 1's one device) to relay:
// the names, signed, one copy per client on the list, sealed to its box
// key, each 40 to 32,768 bytes, at most 10. Refused and dropped as
// SessionAnnounce's copies are; from any other key PERMISSION_DENIED.
// Each replaces every copy, kept in the relay's store; answered by Done
// once stored, then Devices to every watcher with its own copy. Past 30
// an hour per account, RATE_LIMITED. A copy is deleted with its
// recipient's removal and with the account.
message PublishNames {
  string request_id = 1;
  repeated SealedCopy copies = 2;
}

// Read-only key to relay: every notice sealed to its phone's notification
// key, of live sessions and of sessions ended in the last ten minutes.
// Answered by Notices, in frames of at most max_frame_bytes, more set on
// all but the last. Past 30 a minute per connection, RATE_LIMITED.
message FetchNotices {
  string request_id = 1;
}

message Notices {
  string request_id = 1;
  repeated StoredNotice notices = 2;
  bool more = 3;
}

message StoredNotice {
  pirc.v1alpha1.SessionRef session = 1;
  bytes sealed = 2;
  // When the relay took it.
  google.protobuf.Timestamp stored_at = 3;
}

// Client to relay: open a channel to a pi process of a computer of this
// account, by the computer's signing key and the process's instance ID,
// with Noise IK's first message, exactly 96 bytes. The relay sends it to
// the newest connection of that key and instance, with channel_id and
// message only (who opened it is Noise's to say), and answers
// ChannelOpened; or Error with SESSION_NOT_FOUND when no such process is
// connected, INVALID for a malformed one, PERMISSION_DENIED from anything
// but a client. Past 30 opens a minute per client connection, 64 channels
// per client connection or 128 per process connection, RATE_LIMITED.
message OpenChannel {
  string request_id = 1;
  bytes host_key = 2;
  string instance_id = 3;
  bytes message = 4;
  // Relay to process only.
  uint64 channel_id = 5;
}

// Relay to client: the channel's ID, unique for the relay's run.
message ChannelOpened {
  string request_id = 1;
  uint64 channel_id = 2;
}

// Either way: one Noise message, 16 to 65,535 bytes, passed on unread and
// in order; anything else is INVALID. Bytes queued toward one end are
// counted per channel, and so are frames: past 1 MiB, or a quarter of the
// connection's frame queue (64 frames by default), the relay closes the
// channel (RATE_LIMITED), not the connection. Nothing is kept for an end that is
// gone.
message ChannelMessage {
  uint64 channel_id = 1;
  bytes message = 2;
}

// Either way: the channel is over. Either side's is passed to the other.
// The relay closes a channel, telling both ends still connected, when
// either connection goes (SESSION_GONE), either device is removed
// (PERMISSION_DENIED), the process has sent no message 30 seconds after
// the open (TIMEOUT), or its queue toward one end passes 1 MiB or 64
// frames (RATE_LIMITED).
message CloseChannel {
  uint64 channel_id = 1;
  pirc.v1alpha1.ErrorCode code = 2;
}

message Done {
  string request_id = 1;
}

// New device to relay, logged in without an account: wait for the
// account's phone to look up `lookup`, which the code carries. The relay
// answers JoinPaired when it does, or Error with RATE_LIMITED or INVALID
// (a lookup already waiting). The wait ends after ten minutes, with Error
// TIMEOUT, and a join paired from it ten minutes after the wait began. A
// connection logged in without an account that is in no wait or join is
// closed after ten minutes.
message JoinWait {
  // Eight Crockford base32 characters, upper case: 40 bits, made at random
  // by the new device.
  string lookup = 1;
  // A phone's (docs/e2e.md, section 7); unset for a host or a browser.
  Attestation attestation = 2;
}

// The account's phone to relay: join the device waiting under `lookup`.
// Answered by JoinPaired, or Error with SESSION_NOT_FOUND; another client
// gets PERMISSION_DENIED, which spends nothing and leaves the wait. Lookups
// are capped per account and per address.
message JoinLookup {
  string request_id = 1;
  string lookup = 2;
}

// Relay to both sides: the join's ID, for its messages.
message JoinPaired {
  string request_id = 1;
  string join_id = 2;
}

// Either side: one step of the join, passed to the other side unread: at
// most 65,535 bytes, and 8 steps in a join, the ninth ending it.
message JoinMessage {
  string join_id = 1;
  bytes step = 2;
}

// Either side to relay, and relay to the other: the join is over, done or
// failed. Each lookup pairs once.
message JoinEnded {
  string join_id = 1;
}

// Phone to relay, logged in without an account: make an account whose
// list is version 1, signed by this key, which must be its one device.
// Answered by SignedUp, or Error with the request_id: INVALID for a list
// the check refuses, VERSION_UNSUPPORTED for one it cannot take
// (docs/e2e.md, section 3), PERMISSION_DENIED when sign-ups are closed
// and the invite code is not good, or the attestation or subscription is
// refused. The phone then logs in again, with the account's ID. A key
// that already made an account is answered by SignedUp again, with that
// account's ID, when it sends the same version 1, and CONFLICT when it
// sends another.
message SignUp {
  string request_id = 1;
  reserved 2;
  reserved "version";
  Attestation attestation = 3;
  string invite_code = 4;
  // Version 1 of the account's list: the signature, then the body.
  bytes list = 5;
}

// A client to relay, logged in without an account, before it buys a
// subscription to sign up: the relay's sign-up mode, and whether an
// invite code may be used now. Answered by InviteChecked; at most 10 a
// connection, then RATE_LIMITED.
message CheckInvite {
  string request_id = 1;
  // Empty to ask only the mode.
  string invite_code = 2;
}

// Who may sign up (relay/internal/hosted/invites.go).
enum SignUpMode {
  SIGN_UP_MODE_UNSPECIFIED = 0;
  SIGN_UP_MODE_OPEN = 1;
  // An invite code is needed.
  SIGN_UP_MODE_INVITE = 2;
  SIGN_UP_MODE_CLOSED = 3;
}

message InviteChecked {
  string request_id = 1;
  SignUpMode mode = 2;
  // The code may be used now: kept, not used up, not expired.
  bool valid = 3;
  // A review code, for the stores' reviewers: its account needs no
  // subscription, and is deleted when its review subscription ends.
  bool review = 4;
}

message SignedUp {
  string request_id = 1;
  // SHA-256 of version 1's body.
  bytes account_id = 2;
}

// A client or host to relay: a version of the account's list newer than
// the relay's, signed by the account's phone, from any device that has
// it; not from a read-only key. Taken also on a locked account. Answered
// by Done once it is stored, or when it is the relay's newest already;
// by Error with CONFLICT, then List with the relay's newest, when the
// relay has a newer one or another with the same counter; with
// VERSION_UNSUPPORTED when the check cannot take it, INVALID when it
// refuses it, RATE_LIMITED past the versions taken an hour for the
// account (only versions the check accepts count).
//
// Taking it, the relay sends List to every other connection of the
// account, and closes with 1008 the connections of every device the new
// version removes, once that List has been written to them. A device
// stays only if the new version has a device with its signing key (or,
// for a read-only key, its read-only key), the same role and the same
// five keys; but the account's phone is on every version, and a change
// to its other keys removes only its old read-only key's connections.
message PublishList {
  string request_id = 1;
  bytes list = 2;
}

// Relay to device: the newest version of the account's list, as signed.
// Also sent to a key the account's list once had, after its login's
// signature checks, before the Error (UNAUTHENTICATED, "removed") that
// ends it: so a device removed while offline learns of its removal.
message List {
  bytes list = 1;
}

// That a real app on a real phone asks (docs/e2e.md, section 7). It
// stops abuse only; it never decides who belongs to an account.
message Attestation {
  oneof kind {
    AppAttest app_attest = 1;
    PlayIntegrity play_integrity = 2;
    // Only on a relay started with a test verifier.
    bytes test = 3;
  }
  // Apple's signed transaction, or Google's purchase token, for the
  // subscription check; empty during a trial the relay counts itself.
  string subscription = 4;
}

message AppAttest {
  bytes key_id = 1;
  bytes attestation = 2;
}

message PlayIntegrity {
  string token = 1;
}

// Client to relay: a subscription the store proves, for an account that
// is locked or is to have one more. Answered by Done once the store says
// it is live, and then, on a locked account, the connection closes (1000
// "renewed") so that every device logs in again to an unlocked account;
// or by Error with PERMISSION_DENIED and the store's reason.
message RenewSubscription {
  string request_id = 1;
  oneof proof {
    // StoreKit's signed transaction (jwsRepresentation).
    string app_store_transaction = 2;
    // Google Play's purchase token.
    string google_play_token = 3;
  }
}

// The account's phone to relay: delete this account and everything the
// relay holds of it, and close every connection to it. Answered by Done
// before the close; from any other key, PERMISSION_DENIED.
message DeleteAccount {
  string request_id = 1;
}

// As in v1alpha1, for the account's clients.
message RegisterPush {
  string request_id = 1;
  string handle = 2;
}

message UnregisterPush {
  string request_id = 1;
}
