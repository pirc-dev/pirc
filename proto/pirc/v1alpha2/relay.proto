// The relay protocol of a hosted relay (docs/e2e.md): every frame on a
// WebSocket between the relay and a device. One Frame per binary
// WebSocket message. A self-hosted relay speaks v1alpha1 only, and a
// hosted relay v1alpha2 only (docs/e2e.md, section 8).
//
// The relay reads these frames and checks the signed objects in them
// (e2e.proto), but cannot open any payload: announcements and routed
// frames are encrypted between a session and its account's clients.
syntax = "proto3";

package pirc.v1alpha2;

import "google/protobuf/timestamp.proto";
import "pirc/v1alpha1/common.proto";
import "pirc/v1alpha2/e2e.proto";

enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_V1ALPHA2 = 2;
}

message Frame {
  oneof body {
    // Login, in order: Hello (peer), Challenge (relay), Auth (peer),
    // Welcome (relay). Nothing else may be sent before Welcome.
    Hello hello = 1;
    Challenge challenge = 2;
    Auth auth = 3;
    Welcome welcome = 4;

    // Host to relay: sessions of this connection, and the bundle of its
    // process's keys.
    SessionAnnounce session_announce = 10;
    SessionEnd session_end = 11;
    PublishBundle publish_bundle = 12;

    // Client or read-only key to relay: what to receive.
    SubscribeSessions subscribe_sessions = 20;
    Attach attach = 21;
    Detach detach = 22;
    WatchDevices watch_devices = 23;

    // Relay to client: the session list and its changes.
    SessionList session_list = 30;
    SessionUpdated session_updated = 31;
    SessionEnded session_ended = 32;
    Devices devices = 33;

    // Between a session and clients, through the relay.
    Routed routed = 40;

    // The device list (docs/e2e.md, section 3). Client to relay:
    // publishing a version or a withdrawal. Any device to relay: asking
    // for versions. Relay to every device of the account: versions it
    // has not been sent.
    PublishVersion publish_version = 70;
    PublishWithdrawal publish_withdrawal = 71;
    GetVersions get_versions = 72;
    Versions versions = 73;

    // Pre-keys (docs/e2e.md, section 2). Client or read-only key to
    // relay: its new one. Relay to every device of the account: the
    // current ones.
    PublishPreKey publish_pre_key = 74;
    PreKeys pre_keys = 75;

    // Labels (docs/e2e.md, section 3). Client to relay: a label record,
    // and label-key wraps. Relay to client or read-only key: the latest
    // records, and the wraps for it.
    PublishLabels publish_labels = 76;
    PublishLabelKeyWraps publish_label_key_wraps = 77;
    LabelState label_state = 78;

    // Answers to the Publish* frames and to the account frames below.
    Done done = 79;

    // Joining (docs/e2e.md, section 5).
    JoinWait join_wait = 80;
    JoinLookup join_lookup = 81;
    JoinPaired join_paired = 82;
    JoinMessage join_message = 83;
    JoinEnded join_ended = 84;

    // Accounts (docs/e2e.md, section 6). Client to relay, logged in
    // without an account: making one. Client to relay: deleting its own.
    SignUp sign_up = 90;
    SignedUp signed_up = 91;
    DeleteAccount delete_account = 92;
    RegisterPush register_push = 93;
    UnregisterPush unregister_push = 94;

    // Either direction, as in v1alpha1. A device is never removed by a
    // close: 1008 means only that the relay refuses its key now
    // (docs/e2e.md, section 3, Removal).
    pirc.v1alpha1.Error error = 50;
  }
}

message Hello {
  ProtocolVersion protocol_version = 1;
  // The peer's Ed25519 public key, 32 bytes.
  bytes public_key = 2;
  // The account it logs in to, 32 bytes. Empty to log in without one:
  // to sign up, or to wait for a join as a new device.
  bytes account_id = 3;
}

message Challenge {
  // 32 random bytes.
  bytes nonce = 1;
}

message Auth {
  // Ed25519 signature over framed("pirc-auth-v1alpha2", account ID, the
  // relay's origin, nonce) (docs/e2e.md, section 2).
  bytes signature = 1;
}

message Welcome {
  ProtocolVersion protocol_version = 1;
  // Largest Frame the relay accepts or sends, encoded.
  uint32 max_frame_bytes = 2;
  // The key's role on the account's latest version; unspecified when
  // logged in without an account.
  DeviceRole role = 3;
  // The account's latest version, by number and hash: a device that has
  // an older one asks for the rest (GetVersions).
  VersionRef list_version = 4;
}

// A frame's clear part: which keys, and where in their stream. Announced
// and routed payloads from a host are AES-256-GCM under the key ID's
// announcement or conversation key, with the nonce four zero bytes and
// the counter as 8 bytes big-endian, and additional data
// framed("pirc-e2e-v1 frame", account ID, key ID, host key, session ID,
// instance ID, direction, kind, recipient, list version number, counter),
// with the direction and kind each one byte (Direction, FrameKind), the
// recipient the client's key for an answer to one client and empty
// otherwise, and the numbers 8 bytes big-endian.
message FrameKeys {
  // 16 bytes.
  bytes key_id = 1;
  // From 0, one up for every frame the process sends under the key ID.
  uint64 counter = 2;
  // The number of the list version the host had.
  uint64 list_version = 3;
}

enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_ANNOUNCEMENT = 1;
  FRAME_KIND_BROADCAST = 2;
  FRAME_KIND_ANSWER = 3;
}

// Host to relay, as in v1alpha1; the payload is a SignedObject
// (AnnouncementBody), encrypted.
message SessionAnnounce {
  pirc.v1alpha1.SessionRef session = 1;
  FrameKeys keys = 2;
  bytes payload = 3;
  // As in v1alpha1: wake the clients registered for push.
  bool push = 4;
}

message SessionEnd {
  pirc.v1alpha1.SessionRef session = 1;
}

// Host to relay: a SignedObject (BundleBody), stored by key ID while a
// stored announcement uses it, and sent to clients with the session list.
// Answered by Done; a bundle whose signer is not this connection's key,
// or whose list version is not one the relay has, is refused with
// INVALID.
message PublishBundle {
  string request_id = 1;
  SignedObject bundle = 2;
}

message SubscribeSessions {}

message Attach {
  pirc.v1alpha1.SessionRef session = 1;
}

message Detach {
  pirc.v1alpha1.SessionRef session = 1;
}

message SessionEntry {
  pirc.v1alpha1.SessionRef session = 1;
  FrameKeys keys = 2;
  // The latest announcement, encrypted.
  bytes payload = 3;
  google.protobuf.Timestamp announced_at = 4;
  // The bundles of the session's process that the relay holds: the one
  // the announcement uses and any newer, each a SignedObject (BundleBody).
  repeated SignedObject bundles = 5;
}

// Relay to client: every live session, in frames of at most
// max_frame_bytes, as in v1alpha1.
message SessionList {
  repeated SessionEntry sessions = 1;
  bool more = 2;
}

// A session's announcement or bundles changed.
message SessionUpdated {
  SessionEntry entry = 1;
}

message SessionEnded {
  pirc.v1alpha1.SessionRef session = 1;
}

// Client to relay: send me Devices now and whenever it changes.
message WatchDevices {}

// When the relay last saw each device on the latest version.
message DeviceStatus {
  bytes public_key = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
  // Whether it is registered for push.
  bool push = 4;
}

message Devices {
  repeated DeviceStatus devices = 1;
}

// As in v1alpha1, with the clear part of an encrypted frame. Client to
// relay: the payload is an envelope (e2e.proto's EnvelopeBody, signed),
// sealed to the request key of keys.key_id; keys.counter and
// keys.list_version are unset, as both are inside. Host to relay: the
// payload is a session.proto SessionMessage, encrypted.
message Routed {
  pirc.v1alpha1.SessionRef session = 1;
  bytes client_key = 2;
  FrameKeys keys = 3;
  bytes payload = 4;
}

// Client to relay: a SignedObject (ListVersionBody) chaining from the
// latest. Answered by Done once the relay has taken it, after Versions to
// every device; or by Error with the request_id: CONFLICT when another
// version with its number was taken first, sent in Versions before the
// error; INVALID when it does not check (docs/e2e.md, section 3).
message PublishVersion {
  string request_id = 1;
  SignedObject version = 2;
}

// Client to relay: a SignedObject (WithdrawalBody). Answered as
// PublishVersion is.
message PublishWithdrawal {
  string request_id = 1;
  SignedObject withdrawal = 2;
}

// Any device to relay: every version from `from` on, and every
// withdrawal, in Versions with the request_id.
message GetVersions {
  string request_id = 1;
  uint64 from = 2;
}

// Versions, oldest first, and withdrawals; to a device that asked, or to
// every device of the account when one is taken.
message Versions {
  string request_id = 1;
  repeated SignedObject versions = 2;
  repeated SignedObject withdrawals = 3;
}

// Client or read-only key to relay: a SignedObject (PreKeyBody) of its
// own. It replaces the device's last one, and goes to every device of the
// account in PreKeys. Answered by Done.
message PublishPreKey {
  string request_id = 1;
  SignedObject pre_key = 2;
}

// Relay to device: after Welcome every current pre-key of the account,
// with `all` set; later each new one.
message PreKeys {
  repeated SignedObject pre_keys = 1;
  bool all = 2;
}

// Client to relay: a SignedObject (LabelsBody). Answered by Done.
message PublishLabels {
  string request_id = 1;
  SignedObject labels = 2;
}

// Client to relay: SignedObjects (LabelKeyWrapBody). Answered by Done.
message PublishLabelKeyWraps {
  string request_id = 1;
  repeated SignedObject wraps = 2;
}

// Relay to client or read-only key: after Welcome, then on each change.
// The relay keeps, per label key, the records with the highest counter.
message LabelState {
  repeated SignedObject labels = 1;
  // The wraps for this device's pre-keys.
  repeated SignedObject wraps = 2;
}

message Done {
  string request_id = 1;
}

// New device to relay, logged in without an account: wait for a client to
// type the code whose first four characters are `lookup`. The relay
// answers JoinPaired when one does, or Error with RATE_LIMITED or INVALID
// (a lookup already waiting). The wait ends after ten minutes.
message JoinWait {
  // Four Crockford base32 characters, upper case.
  string lookup = 1;
  // A phone's (docs/e2e.md, section 6); unset for a host or a browser.
  Attestation attestation = 2;
}

// Client to relay: join the device waiting under `lookup`. Answered by
// JoinPaired, or Error with SESSION_NOT_FOUND. Lookups are capped per
// account and per address.
message JoinLookup {
  string request_id = 1;
  string lookup = 2;
}

// Relay to both sides: the join's ID, for its messages.
message JoinPaired {
  string request_id = 1;
  string join_id = 2;
}

// Either side: one step (e2e.proto's JoinStep, encoded), passed to the
// other side unread.
message JoinMessage {
  string join_id = 1;
  bytes step = 2;
}

// Either side to relay, and relay to the other: the join is over, done or
// failed. Each lookup pairs once.
message JoinEnded {
  string join_id = 1;
}

// Phone to relay, logged in without an account, with the key of version
// 1's one device: make an account. Answered by SignedUp, or Error with
// the request_id: PERMISSION_DENIED when sign-ups are closed and the
// invite code is not good; INVALID when version 1 does not check.
message SignUp {
  string request_id = 1;
  // A SignedObject (ListVersionBody) of number 1.
  SignedObject version = 2;
  Attestation attestation = 3;
  string invite_code = 4;
}

message SignedUp {
  string request_id = 1;
  // SHA-256 of version 1's body.
  bytes account_id = 2;
}

// That a real app on a real phone asks (docs/e2e.md, section 6). It
// stops abuse only; it never stands in for the list.
message Attestation {
  oneof kind {
    AppAttest app_attest = 1;
    PlayIntegrity play_integrity = 2;
    // Only on a relay started with a test verifier.
    bytes test = 3;
  }
  // Apple's signed transaction, or Google's purchase token, for the
  // subscription check; empty during a trial the relay counts itself.
  string subscription = 4;
}

message AppAttest {
  bytes key_id = 1;
  bytes attestation = 2;
}

message PlayIntegrity {
  string token = 1;
}

// Client to relay: delete this account, every version, pre-key, bundle and
// label of it, and close every connection to it. Answered by Done before
// the close.
message DeleteAccount {
  string request_id = 1;
}

// As in v1alpha1, for clients on the latest version.
message RegisterPush {
  string request_id = 1;
  string handle = 2;
}

message UnregisterPush {
  string request_id = 1;
}
