# sh/check.sh on every push and pull request: on Linux everything but the
# mobile app, end-to-end tests included, once with pi 1.0.0 and once with
# the current pi; on macOS the mobile app (without its
# golden images: GitHub's Macs draw them differently) and the iOS
# notification extension, which need Apple's frameworks.
name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux (pi ${{ matrix.pi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The end-to-end tests run with each pi: the oldest the hosts run, and
    # the current one the extension is developed against (its
    # devDependency); one failing does not stop the other.
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.0.0", "current"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with origin/master
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pi and tmux, for the end-to-end tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          version="${{ matrix.pi }}"
          if [ "$version" = current ]; then
            version=$(node -p "require('./extension/package.json').devDependencies['@earendil-works/pi-coding-agent']")
          fi
          npm install -g "@earendil-works/pi-coding-agent@${version}"
          pi --version
      - run: sh/check.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile --silent
      - run: sh/generate.sh # the notification extension's tests run a relay
      - run: sh/app.sh
      - run: sh/notices.sh
